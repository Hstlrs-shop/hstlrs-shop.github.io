<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nau</title>
  <meta name="description" content="Gestión logística para talleres: órdenes de trabajo, refacciones, compras y planificación.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="logo" aria-hidden="true"></span>nau</a>
    <nav id="nav" class="nav">
      <button data-view="panel" class="active">Panel</button>
      <button data-view="ordenes">Órdenes</button>
      <button data-view="planificacion">Planificación</button>
      <button data-view="inventario">Inventario</button>
      <button data-view="compras">Compras</button>
      <button data-view="ajustes">Ajustes</button>
    </nav>
    <div id="who" class="who"></div>
  </header>

  <main id="app" class="main"></main>

  <dialog id="modal">
    <form id="modal-form" method="dialog">
      <h2 id="modal-title"></h2>
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" class="btn ghost" id="modal-cancel">Cancelar</button>
        <button type="submit" class="btn primary" id="modal-ok">Guardar</button>
      </div>
    </form>
  </dialog>

  <button id="ai-fab" class="ai-fab" type="button" aria-controls="ai-panel" aria-expanded="false"><span aria-hidden="true">✦</span> Asistente</button>
  <aside id="ai-panel" class="ai-panel" hidden aria-label="Asistente de Nau">
    <header class="ai-head">
      <div><b>Asistente Nau</b><div id="ai-quota" class="muted small"></div></div>
      <div><button type="button" class="btn sm ghost" id="ai-clear" title="Nueva conversación">Nueva</button>
      <button type="button" class="btn sm ghost" id="ai-close" aria-label="Cerrar">✕</button></div>
    </header>
    <div id="ai-log" class="ai-log" aria-live="polite"></div>
    <form id="ai-form" class="ai-form">
      <textarea id="ai-input" rows="2" maxlength="2000" placeholder="Pregunta sobre tu taller o sobre cómo usar Nau…" required></textarea>
      <button class="btn primary" id="ai-send" type="submit">Enviar</button>
    </form>
  </aside>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
